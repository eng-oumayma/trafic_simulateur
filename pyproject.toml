[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simulateur-trafic"
dynamic = ["version"]            # lue dans core/__init__.py (__version__)
description = "Simulateur modulaire de trafic routier : réseau, véhicules, statistiques et rapports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Équipe Mobilité Intelligente" }]
keywords = ["simulation", "trafic", "mobilité", "réseau routier", "POO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev  = ["pytest>=7.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]

[project.scripts]
simulateur-trafic = "core.cli:main"

[tool.setuptools.packages.find]
include = ["models*", "core*", "out*"]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
